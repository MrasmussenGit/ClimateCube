<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ sensor.sensor_name }} History</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.documentElement.dataset.theme = localStorage.getItem("theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <style>
        :root { color-scheme: light; --page: #eef2f6; --surface: #ffffff; --text: #243447; --muted: #667788; --control: #d8e0e8; --button: #243447; --grid: rgba(102, 119, 136, 0.2); --shadow: rgba(0, 0, 0, 0.08); }
        :root[data-theme="dark"] { color-scheme: dark; --page: #101820; --surface: #1b2733; --text: #edf3f8; --muted: #a9b7c5; --control: #344454; --button: #d9e4ee; --grid: rgba(169, 183, 197, 0.2); --shadow: rgba(0, 0, 0, 0.3); }
        body { margin: 0; padding: 30px; background: var(--page); color: var(--text); font-family: Arial, sans-serif; transition: background-color 0.2s, color 0.2s; }
        .header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .header-actions { display: flex; gap: 8px; }
        .back-link { color: var(--text); font-weight: bold; text-decoration: none; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
        .metric-controls { display: flex; flex-wrap: wrap; gap: 18px; margin: 0 0 18px; }
        .metric-control { display: flex; align-items: center; gap: 6px; font-weight: bold; cursor: pointer; }
        .metric-control input { width: 18px; height: 18px; accent-color: var(--button); }
        button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--control); color: var(--text); font-size: 15px; cursor: pointer; }
        button.active, #unit-button, #theme-button { background: var(--button); color: var(--page); }
        .chart-card { height: 460px; padding: 22px; background: var(--surface); border-radius: 12px; box-shadow: 0 4px 14px var(--shadow); }
        .details, .status { color: var(--muted); }
        @media (max-width: 600px) {
            body { padding: 18px; }
            .chart-card { height: 360px; padding: 12px; }
        }
    </style>
</head>
<body>
    <a class="back-link" href="{{ url_for('dashboard') }}">← Current readings</a>
    <div class="header">
        <div>
            <h1>{{ sensor.sensor_name }}</h1>
            <p class="details">Temperature history · {{ sensor.device_id }}</p>
            <p id="timezone-details" class="details"></p>
        </div>
        <div class="header-actions">
            <button id="theme-button" type="button" aria-pressed="false">Dark mode</button>
            <button id="unit-button" type="button">Show °F</button>
        </div>
    </div>

    <div class="controls">
        <button class="range-button" data-range="6h">6 hours</button>
        <button class="range-button active" data-range="24h">24 hours</button>
        <button class="range-button" data-range="3d">3 days</button>
        <button class="range-button" data-range="7d">7 days</button>
    </div>

    <div class="metric-controls">
        <label class="metric-control">
            <input type="checkbox" data-dataset="0" checked>
            Temperature
        </label>
        <label class="metric-control">
            <input type="checkbox" data-dataset="1">
            Humidity
        </label>
        <label class="metric-control">
            <input type="checkbox" data-dataset="2">
            Pressure
        </label>
    </div>

    <div class="chart-card"><canvas id="temperature-chart"></canvas></div>
    <p id="status" class="status">Loading history...</p>

    <script>
        const sensorId = {{ sensor.sensor_id }};
        const themeButton = document.getElementById("theme-button");
        const unitButton = document.getElementById("unit-button");
        const rangeButtons = document.querySelectorAll(".range-button");
        const metricCheckboxes = document.querySelectorAll(
            ".metric-control input"
        );
        const status = document.getElementById("status");
        const timezoneDetails = document.getElementById("timezone-details");
        let temperatureUnit = localStorage.getItem("temperatureUnit") || "C";
        let currentRange = "24h";
        let historyReadings = [];

        const timezoneName = Intl.DateTimeFormat().resolvedOptions().timeZone;
        timezoneDetails.textContent = "Times shown in " + (timezoneName || "your local timezone");

        function applyChartTheme() {
            const styles = getComputedStyle(document.documentElement);
            Chart.defaults.color = styles.getPropertyValue("--muted").trim();
            Chart.defaults.borderColor = styles.getPropertyValue("--grid").trim();
        }

        function updateThemeButton() {
            const dark = document.documentElement.dataset.theme === "dark";
            themeButton.textContent = dark ? "Light mode" : "Dark mode";
            themeButton.setAttribute("aria-pressed", String(dark));
        }

        applyChartTheme();

        function parseUtcTimestamp(timestamp) {
            if (!timestamp) return null;
            const normalized = timestamp.replace(" ", "T");
            return new Date(/[zZ]$|[+-]\d\d:\d\d$/.test(normalized)
                ? normalized
                : normalized + "Z");
        }

        function formatLocalTimestamp(timestamp) {
            const date = parseUtcTimestamp(timestamp);

            if (!date || Number.isNaN(date.getTime())) {
                return timestamp;
            }

            return new Intl.DateTimeFormat(undefined, {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit"
            }).format(date);
        }

        const chart = new Chart(document.getElementById("temperature-chart"), {
            type: "line",
            data: {
                labels: [],
                datasets: [{
                    label: "Temperature",
                    data: [],
                    borderColor: "#d35400",
                    backgroundColor: "rgba(211, 84, 0, 0.12)",
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.15,
                    fill: true,
                    yAxisID: "temperature"
                }, {
                    label: "Humidity",
                    data: [],
                    borderColor: "#2471a3",
                    backgroundColor: "rgba(36, 113, 163, 0.08)",
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.15,
                    hidden: true,
                    yAxisID: "humidity"
                }, {
                    label: "Pressure",
                    data: [],
                    borderColor: "#239b56",
                    backgroundColor: "rgba(35, 155, 86, 0.08)",
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.15,
                    hidden: true,
                    yAxisID: "pressure"
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: "index" },
                scales: {
                    x: { ticks: { maxTicksLimit: 10 } },
                    temperature: {
                        type: "linear",
                        position: "left",
                        title: { display: true, text: "Temperature (°C)" }
                    },
                    humidity: {
                        type: "linear",
                        position: "right",
                        min: 0,
                        max: 100,
                        display: false,
                        title: { display: true, text: "Humidity (%)" },
                        grid: { drawOnChartArea: false }
                    },
                    pressure: {
                        type: "linear",
                        position: "right",
                        display: false,
                        title: { display: true, text: "Pressure (hPa)" },
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });

        function updateChart() {
            const useFahrenheit = temperatureUnit === "F";
            chart.data.labels = historyReadings.map(function (reading) {
                return formatLocalTimestamp(reading.reading_time);
            });
            chart.data.datasets[0].data = historyReadings.map(function (reading) {
                const celsius = Number(reading.temperature_c);
                return useFahrenheit ? (celsius * 9 / 5) + 32 : celsius;
            });
            chart.data.datasets[1].data = historyReadings.map(function (reading) {
                return Number(reading.humidity_pct);
            });
            chart.data.datasets[2].data = historyReadings.map(function (reading) {
                return Number(reading.pressure_hpa);
            });
            chart.options.scales.temperature.title.text =
                "Temperature (°" + temperatureUnit + ")";
            unitButton.textContent = useFahrenheit ? "Show °C" : "Show °F";
            chart.update();
        }

        async function loadHistory() {
            status.textContent = "Loading history...";
            try {
                const response = await fetch(
                    "{{ url_for('history_api', sensor_id=sensor.sensor_id) }}?range=" + currentRange
                );
                if (!response.ok) throw new Error("History request failed");
                const result = await response.json();
                historyReadings = result.readings;
                updateChart();
                status.textContent = historyReadings.length
                    ? historyReadings.length + " chart points"
                    : "No readings found for this period.";
            } catch (error) {
                status.textContent = "Unable to load temperature history.";
            }
        }

        rangeButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                rangeButtons.forEach(function (item) { item.classList.remove("active"); });
                button.classList.add("active");
                currentRange = button.dataset.range;
                loadHistory();
            });
        });

        function updateMetricVisibility() {
            metricCheckboxes.forEach(function (checkbox) {
                const datasetIndex = Number(checkbox.dataset.dataset);
                const dataset = chart.data.datasets[datasetIndex];
                dataset.hidden = !checkbox.checked;
                chart.options.scales[dataset.yAxisID].display = checkbox.checked;
            });

            chart.update();
        }

        metricCheckboxes.forEach(function (checkbox) {
            checkbox.addEventListener("change", updateMetricVisibility);
        });

        unitButton.addEventListener("click", function () {
            temperatureUnit = temperatureUnit === "C" ? "F" : "C";
            localStorage.setItem("temperatureUnit", temperatureUnit);
            updateChart();
        });

        themeButton.addEventListener("click", function () {
            const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            document.documentElement.dataset.theme = nextTheme;
            localStorage.setItem("theme", nextTheme);
            applyChartTheme();
            updateThemeButton();
            chart.update();
        });

        updateThemeButton();
        updateMetricVisibility();
        loadHistory();
    </script>
</body>
</html>
